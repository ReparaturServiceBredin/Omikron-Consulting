name: Windows-EXE bauen und veröffentlichen

# Läuft bei jeder Änderung am Programm. Eine neue Veröffentlichung (Release) entsteht nur,
# wenn es zur Versionsnummer in rsb/__init__.py noch keine gibt – sonst wird nur getestet und gebaut.
on:
  push:
    branches: [main, claude/nice-noether-j6v2s5]
    paths:
      - "rsb/**"
      - "start_exe.py"
      - "buchhaltung.spec"
      - "firma.toml"
      - "requirements.txt"
      - "bauen/**"
      - "verteilung/**"
      - "docs/AENDERUNGEN.md"
      - ".github/workflows/release.yml"
  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHONUTF8: "1"   # Umlaute/Sonderzeichen in Python-Ausgaben auch unter Windows

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q

  windows-exe:
    needs: tests
    runs-on: windows-latest
    outputs:
      neu: ${{ steps.v.outputs.neu }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Version ermitteln
        id: v
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=$(python bauen/version_info.py)
          echo "version=$V" >> "$GITHUB_OUTPUT"
          N=$(python -c "import tomllib; print(tomllib.load(open('firma.toml','rb'))['programm']['kurzname'])")
          echo "name=$N" >> "$GITHUB_OUTPUT"
          if gh release view "v$V" > /dev/null 2>&1; then echo "neu=nein" >> "$GITHUB_OUTPUT"; else echo "neu=ja" >> "$GITHUB_OUTPUT"; fi
          echo "Version $V"

      - name: Abhängigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller==6.22.3 pyinstaller-hooks-contrib==2026.8

      - name: EXE bauen
        run: pyinstaller --noconfirm --clean buchhaltung.spec

      - name: EXE testen (startet sie und fragt die Version ab)
        shell: pwsh
        run: |
          $env:RSB_DATEN = "$env:RUNNER_TEMP\testdaten"
          $env:RSB_KEIN_BROWSER = "1"
          $env:RSB_KEIN_UPDATE = "1"
          $env:RSB_PORT = "5077"
          $p = Start-Process -FilePath "dist\${{ steps.v.outputs.name }}.exe" -PassThru
          $ok = $false
          for ($i = 0; $i -lt 60; $i++) {
            Start-Sleep -Seconds 2
            try {
              $r = Invoke-RestMethod -Uri "http://127.0.0.1:5077/version" -TimeoutSec 3
              if ($r.version -eq "${{ steps.v.outputs.version }}") { $ok = $true; break }
            } catch { }
          }
          $seite = (Invoke-WebRequest -Uri "http://127.0.0.1:5077/einrichten" -UseBasicParsing).StatusCode
          Get-Process -Name "${{ steps.v.outputs.name }}" -ErrorAction SilentlyContinue | Stop-Process -Force
          if (-not $ok -or $seite -ne 200) { Write-Error "EXE startet nicht korrekt"; exit 1 }
          Write-Host "EXE läuft: Version ${{ steps.v.outputs.version }}, Startseite $seite"

      - name: Installations-Skript testen (SharePoint-Paket)
        shell: pwsh
        run: |
          $env:RSB_DATEN = "$env:RUNNER_TEMP\installtest"
          $env:RSB_KEIN_BROWSER = "1"
          $env:RSB_KEIN_UPDATE = "1"
          $env:RSB_KEIN_SYMBOL = "1"
          $env:RSB_PORT = "5078"
          Copy-Item "dist\${{ steps.v.outputs.name }}.exe" verteilung\sharepoint\
          powershell -NoProfile -ExecutionPolicy Bypass -File verteilung\sharepoint\installieren.ps1
          if ($LASTEXITCODE -ne 0) { Write-Error "Installations-Skript fehlgeschlagen"; exit 1 }
          $exe = "$env:LOCALAPPDATA\Programs\${{ steps.v.outputs.name }}\${{ steps.v.outputs.name }}.exe"
          $lnk = Join-Path ([Environment]::GetFolderPath('Desktop')) "Omikron Buchhaltung.lnk"
          if (-not (Test-Path $exe)) { Write-Error "EXE nicht installiert"; exit 1 }
          if (-not (Test-Path $lnk)) { Write-Error "Desktop-Verknüpfung fehlt"; exit 1 }
          $ok = $false
          for ($i = 0; $i -lt 40; $i++) {
            Start-Sleep -Seconds 2
            try { Invoke-RestMethod -Uri "http://127.0.0.1:5078/version" -TimeoutSec 3 | Out-Null; $ok = $true; break } catch { }
          }
          Get-Process -Name "${{ steps.v.outputs.name }}" -ErrorAction SilentlyContinue | Stop-Process -Force
          if (-not $ok) { Write-Error "Installiertes Programm startet nicht"; exit 1 }
          Write-Host "Installation per Skript in Ordnung"

      - name: Prüfsumme
        shell: pwsh
        run: |
          $h = (Get-FileHash dist\${{ steps.v.outputs.name }}.exe -Algorithm SHA256).Hash.ToLower()
          "$h  ${{ steps.v.outputs.name }}.exe" | Out-File -Encoding ascii -NoNewline dist\${{ steps.v.outputs.name }}.exe.sha256
          Get-Content dist\${{ steps.v.outputs.name }}.exe.sha256

      - name: SharePoint-Paket packen
        shell: pwsh
        run: |
          $paket = "dist\paket\Omikron Buchhaltung"
          New-Item -ItemType Directory -Force $paket | Out-Null
          Copy-Item verteilung\sharepoint\Installieren.cmd, verteilung\sharepoint\Deinstallieren.cmd, `
            verteilung\sharepoint\installieren.ps1, verteilung\sharepoint\deinstallieren.ps1, `
            verteilung\sharepoint\Anleitung.pdf, "dist\${{ steps.v.outputs.name }}.exe" $paket
          Compress-Archive -Path $paket -DestinationPath "dist\${{ steps.v.outputs.name }}-SharePoint.zip" -Force

      - name: EXE als Artefakt ablegen
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.v.outputs.name }}-${{ steps.v.outputs.version }}
          path: |
            dist/${{ steps.v.outputs.name }}.exe
            dist/${{ steps.v.outputs.name }}.exe.sha256
            dist/${{ steps.v.outputs.name }}-SharePoint.zip

      - name: Veröffentlichen (nur bei neuer Versionsnummer)
        if: steps.v.outputs.neu == 'ja'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="${{ steps.v.outputs.version }}"
          python bauen/release_notes.py "$V"
          gh release create "v$V" dist/${{ steps.v.outputs.name }}.exe dist/${{ steps.v.outputs.name }}.exe.sha256 \
            "dist/${{ steps.v.outputs.name }}-SharePoint.zip" \
            --title "Version $V" --notes-file release_notes.md --target "${{ github.sha }}" --latest

  # Browser-Version in Azure aktualisieren – nur wenn eingerichtet (Repository-Variablen aus
  # verteilung/azure/azure-einrichten.sh) und bei einer neuen Versionsnummer bzw. manuellem Start.
  azure:
    needs: windows-exe
    if: vars.AZURE_CLIENT_ID != '' && (needs.windows-exe.outputs.neu == 'ja' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # Anmeldung bei Azure ohne Passwort (OpenID Connect)
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Programmpaket
        run: zip -qr app.zip rsb firma.toml requirements.txt docs/AENDERUNGEN.md -x '*/__pycache__/*'
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          package: app.zip
      - name: Neue Version läuft?
        run: |
          V=$(sed -n 's/^VERSION_NUMMER = "\(.*\)"/\1/p' rsb/__init__.py)
          for i in $(seq 1 60); do
            if curl -fsS --max-time 8 "https://${{ vars.AZURE_WEBAPP_HOST }}/version" | grep -q "\"$V\""; then
              echo "Azure läuft mit Version $V"; exit 0; fi
            sleep 10
          done
          echo "Azure meldet nicht Version $V – bitte Protokollstream der Web-App prüfen"; exit 1
